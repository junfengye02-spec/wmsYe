{% extends complete_label_parent|default:"label/equipment_label.html" %}
{% load i18n barcode %}
{% block equipment_qr %}
    {% if complete_label_parent %}
        {{ block.super }}
    {% else %}
        <img class='equipment-qr product-qr' alt="{% trans 'Product IPN QR Code' %}" src='{% qrcode product_ipn border=4 error_correction="M" %}'>
    {% endif %}
{% endblock equipment_qr %}
